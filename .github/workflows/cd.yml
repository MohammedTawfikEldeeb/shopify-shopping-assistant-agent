name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  GAR_REPOSITORY: shopify-assistant
  SERVICE_NAME: shopify-assistant-api
  IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/shopify-assistant/backend

jobs:

  # ===========================================================================
  # JOB 1 — Run Tests
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Install dependencies
        run: |
          uv sync --no-dev

      - name: Run tests
        run: |
          pytest

  # ===========================================================================
  # JOB 2 — Build and Push Docker Image
  # ===========================================================================
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    outputs:
      image_tag: ${{ github.sha }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Authenticate to Google Cloud
      # Recommended: Workload Identity Federation
      # -----------------------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # -----------------------------------------------------------------------
      # Ensure Artifact Registry repository exists
      # -----------------------------------------------------------------------
      - name: Create Artifact Registry repository if missing
        run: |
          gcloud artifacts repositories describe $GAR_REPOSITORY \
            --location=$GCP_REGION \
            >/dev/null 2>&1 || \
          gcloud artifacts repositories create $GAR_REPOSITORY \
            --repository-format=docker \
            --location=$GCP_REGION \
            --description="Docker repository"

      # -----------------------------------------------------------------------
      # Configure Docker Authentication
      # -----------------------------------------------------------------------
      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            ${{ secrets.GCP_REGION }}-docker.pkg.dev \
            --quiet

      # -----------------------------------------------------------------------
      # Setup Docker Buildx
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # Install uv
      # -----------------------------------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      # -----------------------------------------------------------------------
      # Export requirements.txt
      # -----------------------------------------------------------------------
      - name: Export requirements.txt
        run: |
          uv export --no-dev -o requirements.txt

      # -----------------------------------------------------------------------
      # Build and Push Docker Image with Cache
      # -----------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # JOB 3 — Deploy to Cloud Run
  # ===========================================================================
  deploy-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # -----------------------------------------------------------------------
      # Deploy to Cloud Run
      # -----------------------------------------------------------------------
      - name: Deploy API
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image ${{ env.IMAGE }}:${{ needs.build-and-push.outputs.image_tag }} \
            --region $GCP_REGION \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      # -----------------------------------------------------------------------
      # Verify Deployment Health with Retries
      # -----------------------------------------------------------------------
      - name: Verify deployment health
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME \
            --region=$GCP_REGION \
            --format='value(status.url)')

          echo "Service URL: $URL"

          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")

            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi

            echo "Attempt $i failed with status $STATUS"
            sleep 10
          done

          echo "Deployment health check failed"
          exit 1