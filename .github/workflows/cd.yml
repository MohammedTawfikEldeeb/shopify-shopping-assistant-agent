name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  ECS_TASK_DEFINITION: .aws/task-definition.json
  CONTAINER_NAME: shopify-assistant

jobs:

  # ===========================================================================
  # JOB 1 - Build and Push Docker Image to ECR
  # ===========================================================================
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image_tag: ${{ github.sha }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Export requirements.txt
        run: uv export --no-dev -o requirements.txt

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # JOB 2 - Deploy to ECS Fargate
  # ===========================================================================
  deploy-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: get-account-id
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Inject AWS Account ID into task definition
        run: |
          sed -i "s/AWS_ACCOUNT_ID/${{ steps.get-account-id.outputs.account_id }}/g" ${{ env.ECS_TASK_DEFINITION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fill in the new image ID in the task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.image_tag }}
          environment-variables: |
            POSTGRES__HOST=${{ secrets.POSTGRES__HOST }}
            POSTGRES__PORT=${{ secrets.POSTGRES__PORT }}
            POSTGRES__DATABASE=${{ secrets.POSTGRES__DATABASE }}
            POSTGRES__USER=${{ secrets.POSTGRES__USER }}
            POSTGRES__PASSWORD=${{ secrets.POSTGRES__PASSWORD }}
            POSTGRES__SSLMODE=${{ secrets.POSTGRES__SSLMODE }}
            OPENROUTER_API__KEY=${{ secrets.OPENROUTER_API__KEY }}
            GROQ_API__KEY=${{ secrets.GROQ_API__KEY }}
            LLM__PROVIDER=${{ secrets.LLM__PROVIDER }}
            LLM_MODEL__NAME=${{ secrets.LLM_MODEL__NAME }}
            OPIK__API_KEY=${{ secrets.OPIK__API_KEY }}
            OPIK__PROJECT_NAME=${{ secrets.OPIK__PROJECT_NAME }}
            CORS__ALLOWED_ORIGINS=${{ secrets.CORS__ALLOWED_ORIGINS }}
            VECTOR_DB_PROVIDER=PGVECTOR

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify deployment
        run: |
          echo "Deployment complete. Checking service status..."
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{status:status,runningCount:runningCount,desiredCount:desiredCount}' \
            --output table
