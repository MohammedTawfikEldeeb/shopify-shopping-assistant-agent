name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint, type-check, and validate Python code
  # ---------------------------------------------------------------------------
  validate-python:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: shopify_assistant
          POSTGRES_USER: shopify_user
          POSTGRES_PASSWORD: shopify_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Install dependencies
        run: uv sync

      - name: Check Python syntax
        run: |
          uv run python -m py_compile src/config.py
          uv run python -m py_compile src/api/main.py

      - name: Verify migrations are valid
        env:
          POSTGRES__HOST: localhost
          POSTGRES__PORT: 5432
          POSTGRES__DATABASE: shopify_assistant
          POSTGRES__USER: shopify_user
          POSTGRES__PASSWORD: shopify_password
          POSTGRES__SSLMODE: disable
        run: uv run alembic -c src/db/migration/alembic.ini check

      - name: Run pytest
        env:
          POSTGRES__HOST: localhost
          POSTGRES__PORT: 5432
          POSTGRES__DATABASE: shopify_assistant
          POSTGRES__USER: shopify_user
          POSTGRES__PASSWORD: shopify_password
          POSTGRES__SSLMODE: disable
          OPENROUTER_API__KEY: ${{ secrets.OPENROUTER_API__KEY }}
          GROQ_API__KEY: ${{ secrets.GROQ_API__KEY }}
          LLM__PROVIDER: openrouter
          LLM_MODEL__NAME: openai/gpt-oss-20b:nitro
          OPIK__API_KEY: ${{ secrets.OPIK__API_KEY }}
          OPIK__PROJECT_NAME: shopify-shopping-assistant-agent
          SEARCH__USE_HYBRID_SEARCH: true
          VECTOR_DB_PROVIDER: PGVECTOR
        run: uv run pytest

  # ---------------------------------------------------------------------------
  # Job 2: Validate Docker image builds successfully
  # ---------------------------------------------------------------------------
  validate-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Export requirements.txt from lock file
        run: uv export --no-dev -o requirements.txt

      - name: Build Docker image (no push)
        run: docker build -t shopify-assistant:test .

      - name: Verify image exposes port 8000
        run: |
          PORT=$(docker inspect shopify-assistant:test --format='{{range $p, $_ := .Config.ExposedPorts}}{{$p}}{{end}}')
          if [ "$PORT" != "8000/tcp" ]; then
            echo "Expected port 8000/tcp to be exposed, got: $PORT"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Job 3: Validate frontend build
  # ---------------------------------------------------------------------------
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build output exists
        working-directory: frontend
        run: |
          if [ ! -d "dist" ]; then
            echo "Build output directory 'dist' not found"
            exit 1
          fi
          echo "Frontend build verified: $(ls dist | wc -l) files"
