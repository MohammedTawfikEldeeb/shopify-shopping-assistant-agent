name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md

jobs:


  validate-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Export requirements.txt from lock file
        run: uv export --no-dev -o requirements.txt

      - name: Build Docker image (no push)
        run: docker build -t shopify-assistant:test .

      - name: Verify image exposes port 8000
        run: |
          PORT=$(docker inspect shopify-assistant:test --format='{{range $p, $_ := .Config.ExposedPorts}}{{$p}}{{end}}')
          if [ "$PORT" != "8000/tcp" ]; then
            echo "Expected port 8000/tcp to be exposed, got: $PORT"
            exit 1
          fi


  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build output exists
        working-directory: frontend
        run: |
          if [ ! -d "dist" ]; then
            echo "Build output directory 'dist' not found"
            exit 1
          fi
          echo "Frontend build verified: $(ls dist | wc -l) files"
